services:
  - type: web
    name: biomedica-smarttv
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run serve:prod
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: BIOMEDICA_CORE_API_URL
        value: https://app-biomedica-web.onrender.com